services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fitspot_app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
      APP_LOCALE: ru
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - .:/var/www
    networks:
      - fitspot_network

  web:
    depends_on:
      app:
        condition: service_started
        restart: true
    image: nginx:alpine
    container_name: fitspot_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - fitspot_network

  db:
    image: postgres:16-alpine
    container_name: fitspot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fitspot}
      POSTGRES_USER: ${DB_USERNAME:-fitspot_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fitspot_network

  redis:
    image: redis:7-alpine
    container_name: fitspot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fitspot_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fitspot_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - fitspot_network

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fitspot_queue
    restart: unless-stopped
    environment:
      APP_LOCALE: ru
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    command: /usr/bin/supervisord -c /etc/supervisor/supervisord.conf
    volumes:
      - .:/var/www
      - ./docker/supervisor/supervisord.conf:/etc/supervisor/supervisord.conf
    depends_on:
      - app
      - redis
      - rabbitmq
    networks:
      - fitspot_network

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    networks:
      - fitspot_network

networks:
  fitspot_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local